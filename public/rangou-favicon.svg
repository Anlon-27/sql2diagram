<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>

  <!-- Database cylinder (ER diagram icon) -->
  <ellipse cx="32" cy="22" rx="14" ry="5" fill="url(#cyl)"/>
  <rect x="18" y="22" width="28" height="8" fill="url(#cyl)"/>
  <ellipse cx="32" cy="30" rx="14" ry="5" fill="url(#cyl)" opacity="0.7"/>
  <rect x="18" y="30" width="28" height="4" fill="url(#cyl)" opacity="0.5"/>
  <ellipse cx="32" cy="34" rx="14" ry="5" fill="url(#cyl)" opacity="0.35"/>

  <!-- Connection lines -->
  <line x1="18" y1="34" x2="14" y2="44" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="46" y1="34" x2="50" y2="44" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Attribute boxes -->
  <rect x="6" y="42" width="16" height="10" rx="3" fill="#fbbf24" opacity="0.95"/>
  <rect x="42" y="42" width="16" height="10" rx="3" fill="#fbbf24" opacity="0.95"/>
</svg>
